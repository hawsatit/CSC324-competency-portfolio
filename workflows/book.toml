\f0\fs24 \cf0 name: Deploy mdBook\
on:\
  push:\
    branches: [main]\
  workflow_dispatch:\
\
permissions:\
  contents: read\
  pages: write\
  id-token: write\
\
jobs:\
  build:\
    runs-on: ubuntu-latest\
    steps:\
      - uses: actions/checkout@v4\
      - uses: peaceiris/actions-mdbook@v2\
        with:\
          mdbook-version: latest\
      - run: mdbook build\
      - uses: actions/upload-pages-artifact@v3\
        with:\
          path: ./book\
\
  deploy:\
    needs: build\
    runs-on: ubuntu-latest\
    environment:\
      name: github-pages\
      url: $\{\{ steps.deployment.outputs.page_url \}\}\
    steps:\
      - id: deployment\
        uses: actions/deploy-pages@v4}